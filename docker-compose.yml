services:
  broker:
    build:
      context: ./broker
    ports:
      - "9099:9099"
    volumes:
      - ./data:/app/data

    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    environment:
      - TCP_HOST=broker
      - TCP_PORT=9099
      - WS_PORT=8080
    depends_on:
      - broker
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - gateway
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order
    environment:
      - GATEWAY_WS=ws://gateway:8080
      - ORDER_INTERVAL_MS=3000
    depends_on:
      - gateway
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment
    environment:
      - GATEWAY_WS=ws://gateway:8080
      - PAYMENT_MAX_AMOUNT=200000
      - PAYMENT_PROCESS_MS=800
    depends_on:
      - gateway
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification
    environment:
      - GATEWAY_WS=ws://gateway:8080
    depends_on:
      - gateway
    restart: unless-stopped
