services:
  broker:
    build:
      context: ./broker
    ports:
      - "9099:9099"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9099"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    environment:
      - TCP_HOST=broker
      - TCP_PORT=9099
      - WS_PORT=8080
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order
    environment:
      - GATEWAY_WS=ws://gateway:8080
      - ORDER_INTERVAL_MS=3000
    depends_on:
      - gateway
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment
    environment:
      - GATEWAY_WS=ws://gateway:8080
      - PAYMENT_MAX_AMOUNT=200000
      - PAYMENT_PROCESS_MS=800
    depends_on:
      - gateway
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification
    environment:
      - GATEWAY_WS=ws://gateway:8080
    depends_on:
      - gateway
    restart: unless-stopped
